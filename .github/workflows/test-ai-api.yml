name: Test AI API

on:
  workflow_dispatch:

jobs:
  test-ai-api:
    runs-on: ubuntu-latest

    steps:
      - name: Test OpenAI-compatible chat API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORIZON_AI_BASE_URL: ${{ secrets.HORIZON_AI_BASE_URL }}
          MODEL: gpt-5.6
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set."
            exit 1
          fi

          if [ -z "${HORIZON_AI_BASE_URL:-}" ]; then
            echo "::error::HORIZON_AI_BASE_URL secret is not set."
            exit 1
          fi

          base="${HORIZON_AI_BASE_URL%/}"
          if [[ "$base" == */chat/completions ]]; then
            endpoint="$base"
          else
            endpoint="$base/chat/completions"
          fi

          python - <<'PY' > payload.json
          import json
          import os

          print(json.dumps({
              "model": os.environ["MODEL"],
              "messages": [
                  {
                      "role": "system",
                      "content": "Return JSON only."
                  },
                  {
                      "role": "user",
                      "content": "Reply with {\"ok\":true,\"source\":\"horizon-test\"}."
                  }
              ],
              "temperature": 0.3,
              "max_tokens": 64,
              "response_format": {"type": "json_object"}
          }))
          PY

          status="$(
            curl --silent --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              --request POST "$endpoint" \
              --header "Authorization: Bearer ${OPENAI_API_KEY}" \
              --header "Content-Type: application/json" \
              --data @payload.json
          )"

          echo "HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::AI API request failed."
            python - <<'PY'
          from pathlib import Path

          text = Path("response.json").read_text(encoding="utf-8", errors="replace")
          print(text[:2000])
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("response.json").read_text(encoding="utf-8"))
          choice = (data.get("choices") or [{}])[0]
          message = choice.get("message") or {}
          content = message.get("content") or ""
          print(f"Model returned: {data.get('model', '')}")
          print(f"Content: {content[:500]}")
          if data.get("usage"):
              print(f"Usage: {data['usage']}")
          if not content.strip():
              raise SystemExit("No assistant content returned.")
          PY
